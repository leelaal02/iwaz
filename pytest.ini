[pytest]
# rootdir을 저장소 루트로 고정한다 — 설정 파일이 없으면 pytest가 인자 경로에서
# 위로 올라가다 멈춘 자리를 rootdir로 삼아, 스킬 폴더에서 실행하면 그 안에
# .pytest_cache/가 생긴다(배포용 스킬 폴더에 캐시가 섞임). 이 파일이 있으면
# 어느 폴더에서 실행하든 캐시가 루트 한 곳에만 쌓인다.
# testpaths 덕분에 인자 없이 `python -m pytest`만으로 스킬 테스트가 돈다.
testpaths = .claude/skills/meeting-minutes/tests
